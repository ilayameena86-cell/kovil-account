name: Extract Kovil Kanakku ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project files
        run: |
          unzip -q kovil-kanakku-app-1.zip
          cp -R kovil-kanakku-app/. .
          rm -rf kovil-kanakku-app
          rm kovil-kanakku-app-1.zip

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract Kovil Kanakku app files"
          git push
